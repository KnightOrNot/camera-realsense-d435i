[project]
name = "camera-realsense-d435i"
version = "0.1.0"
description = "Remote D435i capture, information and browser RGB-D preview"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["pyrealsense2>=2.59,<3", "numpy>=2,<3", "pillow>=11,<13"]

[project.scripts]
camera-realsense-d435i = "camera_realsense_d435i.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/camera_realsense_d435i/web.py" = ["E501"]
