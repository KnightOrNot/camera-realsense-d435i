# camera-realsense-d435i 默认参数。
#
# 优先级：显式命令行参数 > 环境变量（XCORE_CAMERA_SSH_TARGET）> 本文件。
# 本地客户端与远端 serve 使用同一份默认值；远端每台相机的实际 profile 仍由
# ~/.config/camera-realsense-d435i/camN.json 提供，部署脚本不会覆盖现场文件。

[client]
# 默认操作哪台相机；脚本通过 --camera 覆盖。
camera = "cam1"
# 两台相机所在的远端主机，本地命令通过 SSH 隧道访问。
ssh_target = "rokae@192.168.2.225"
# 远端 API 与本地转发端口一一对应；两台必须不同。
cam1_port = 8086
cam2_port = 8087
# 本地截图根目录；最终路径为 <snapshot_dir>/<camera>/<timestamp>/。
snapshot_dir = "captures"

[serve]
# 远端服务只允许绑定 loopback，禁止无认证地暴露到局域网。
host = "127.0.0.1"
port = 8086
# 无损 RGB／Z16 连续记录只允许写在该目录下；留空则禁用记录 API。
# 远端数据根目录与 xcore-dataset 的 ~/project/xcore-data/raw 保持一致。
record_root = "~/project/xcore-data/raw"
# 采集线程与写盘线程之间的有界队列；满队列会把该段记录标记为失败。
record_queue = 16
